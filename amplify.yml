version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -e MONGODB_URI -e MONGODB_DB_NAME -e ADMIN_PASSWORD -e AWS_S3_BUCKET_NAME -e AWS_S3_REGION -e AWS_S3_ACCESS_KEY_ID -e AWS_S3_SECRET_ACCESS_KEY -e AWS_S3_CDN_DOMAIN >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*

