version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -e MONGODB_URI -e MONGODB_DB_NAME -e ADMIN_PASSWORD -e OPENAI_API_KEY -e NEXT_PUBLIC_PAYPAL_CLIENT_ID -e PAYPAL_CLIENT_SECRET -e SMTP_HOST -e SMTP_PORT -e SMTP_SECURE -e SMTP_USER -e SMTP_PASSWORD -e FROM_EMAIL -e S3_BUCKET_NAME -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_CDN_DOMAIN >> .env.production
        - npm run build
    postBuild:
      commands:
        - echo "Starting automatic translation..."
        - npx tsx scripts/post-deploy-translate.ts || echo "Translation completed or skipped"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*

